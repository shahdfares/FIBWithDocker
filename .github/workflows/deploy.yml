name: Docker react project 
on:
 push:
  branches:
   - feature

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v2
   - run: docker login -u ${{ secrets.DOCKER_USERNAME}} -p ${{ secrets.DOCKER_PASSWORD}}
   # - run: docker build -t shahdfares/clienttest ./client -f ./client/Dockerfile.dev
   # - run: docker run -e CI=true shahdfares/clienttest npm run test

   - run: docker build -t shahdfares/multi-client -f ./client/Dockerfile ./client
   - run: docker build -t shahdfares/multi-server -f ./server
   - run: docker build -t shahdfares/multi-worker -f worker
   - run: docker build -t shahdfares/multi-nginx -f nginx

   - run: docker push  shahdfares/multi-client 
   - run: docker push  shahdfares/multi-server 
   - run: docker push  shahdfares/multi-worker 
   - run: docker push  shahdfares/multi-nginx 
        
