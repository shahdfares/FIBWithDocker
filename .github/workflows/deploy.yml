name: FIB project
on:
 push:
  branch:
   - master 

jobs:
 build:
  runs-on: ubuntu
  steps:
   - uses: action/checkout@v2
   - run: docker login -u ${{secrets.DOCKER_USERNAME}} -P ${{secrets.DOCKER_PASSWORD}}
   - run: docker build -t shahdfares/clientTest ./client
   - run: docker run -e CI=true shahdfares/clientTest npm run test

