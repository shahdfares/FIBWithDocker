name: Docker react project 
on:
 push:
  branches:
   - feature

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v2
   - run: docker login -u ${{ secrets.DOCKER_USERNAME}} -p ${{ secrets.DOCKER_PASSWORD}}
   # - run: docker build -t shahdfares/clienttest ./client -f ./client/Dockerfile.dev
   # - run: docker run -e CI=true shahdfares/clienttest npm run test

   - run: docker build -t shahdfares/multi-client -f ./client/Dockerfile ./client
   - run: docker build -t shahdfares/multi-server -f ./server/Dockerfile ./server
   - run: docker build -t shahdfares/multi-worker -f worker/Dockerfile ./worker
   - run: docker build -t shahdfares/multi-nginx -f nginx/Dockerfile ./nginx

   - run: docker push  shahdfares/multi-client 
   - run: docker push  shahdfares/multi-server 
   - run: docker push  shahdfares/multi-worker 
   - run: docker push  shahdfares/multi-nginx 

# Creating a deployment
   - name: create deployment package
     run: zip -r deploy.zip . -x '*.git*'

     # 1. Prebuilt Action: Log in to Azure
   - uses: azure/login@v2
     with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Prebuilt Action: Deploy to App Service
   - uses: azure/webapps-deploy@v3
     with:
      app-name: 'my-azure-web-app'
      package: '.'